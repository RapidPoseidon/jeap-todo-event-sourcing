services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  oauth-mock-server:
    build:
      context: ./backend
      dockerfile: todo-oauth-mock-server/Dockerfile
    environment:
      SERVER_PORT: 8180
      AUTH_BASE_URL: http://localhost:8180/jeap-oauth-mock-server
      UI_BASE_URL: http://localhost:4200
    ports:
      - "8180:8180"

  task-service:
    build:
      context: ./backend
      dockerfile: todo-task-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      oauth-mock-server:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/todo?currentSchema=data
      DB_USERNAME: todo
      DB_PASSWORD: todo
      # The issuer is the URL the browser uses; the JWKS is fetched over the compose network.
      OAUTH_ISSUER: http://localhost:8180/jeap-oauth-mock-server
      OAUTH_JWK_SET_URI: http://oauth-mock-server:8180/jeap-oauth-mock-server/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      PROMETHEUS_PASSWORD: "{noop}prometheus"
    ports:
      - "8080:8080"

  task-ui:
    build:
      context: ./frontend/todo-task-ui
    depends_on:
      - task-service
    environment:
      API_URL: http://localhost:8080
      OAUTH_ISSUER: http://localhost:8180/jeap-oauth-mock-server
      OAUTH_CLIENT_ID: todo-task-ui
    ports:
      - "4200:80"

volumes:
  postgres-data:
