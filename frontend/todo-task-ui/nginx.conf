server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The Angular router owns every path, so unknown paths return index.html instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /assets/config.json {
        add_header Cache-Control "no-store";
    }
}
